<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8B5CF6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Plate with sleek rounded corners -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="2.5" />

  <!-- Monogram T with cursive flourish -->
  <g filter="url(#glow)">
    <!-- Top flourished loop / crossbar of cursive T -->
    <path
      d="M 18 24 C 20 18, 28 17, 34 18 C 40 19, 45 17, 47 16 C 45 20, 39 23, 34 22 C 29 21, 23 23, 21 26"
      stroke="url(#tGrad)"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Center elegant descending stem and base loop -->
    <path
      d="M 33 21 C 33 28, 33.5 36, 32.5 42 C 31.5 47, 26 48.5, 22 46 C 20.5 45, 20 42.5, 22 41 C 24 39.5, 27 41, 27 43"
      stroke="url(#tGrad)"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Modern tech cyan dot accent -->
    <circle cx="46" cy="18" r="2.5" fill="#38BDF8" />
  </g>
</svg>